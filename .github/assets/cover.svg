    <text x="64" y="711" font-size="24" font-weight="650" letter-spacing="-.5">Точные цитаты</text>
    <path d="M492 650v66" stroke="#c9c2b7"/>
    <text x="532" y="666" font-size="13" font-weight="750" letter-spacing="1.6">ЧЕЛОВЕК ПРИНИМАЕТ РЕШЕНИЕ</text>
    <text x="532" y="711" font-size="24" font-weight="650" letter-spacing="-.5">Отдельный ручной разбор</text>
    <path d="M1062 650v66" stroke="#c9c2b7"/>
    <text x="1102" y="666" font-size="13" font-weight="750" letter-spacing="1.6">ЛОКАЛЬНЫЙ MVP</text>
    <text x="1102" y="711" font-size="24" font-weight="650" letter-spacing="-.5">В браузере · RU / KK</text>
  </g>
